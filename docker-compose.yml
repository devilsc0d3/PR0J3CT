version: '3.8'

services:
  # postgres container
  db:
    image: postgres:17
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: pr0j3ct
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - db_network

  # pgadmin container
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - db_network
    depends_on:
      - db

  #pr0j3ct
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:root@db:5432/db?schema=public
    depends_on:
      - db
    command: ["npm", "run", "dev", "--", "--host"]
    networks:
      - db_network

volumes:
    postgres_data:

networks:
    db_network:
        driver: bridge