name: Build, Test

on:
  push:
    branches:
      -next
  pull_request:
    branches:
        -next

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'